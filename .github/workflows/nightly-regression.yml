name: Nightly Regression Tests

on:
  schedule:
    # Every day at 9:00 PM IST
    - cron: '30 15 * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  regression:
    name: Nightly Regression - ${{ matrix.browser }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Regression Tests
        run: npx playwright test --grep "@regression" --project=${{ matrix.browser }}
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: nightly-regression-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30


  publish-report:
    name: Publish Nightly Report
    runs-on: ubuntu-latest
    needs: regression

    steps:

      - name: Download all browser reports
        uses: actions/download-artifact@v6
        with:
          path: nightly-reports

      - name: Create Pages site
        run: |
          mkdir -p site/chromium
          mkdir -p site/firefox
          mkdir -p site/webkit

          cp -r nightly-reports/nightly-regression-chromium/. site/chromium/
          cp -r nightly-reports/nightly-regression-firefox/. site/firefox/
          cp -r nightly-reports/nightly-regression-webkit/. site/webkit/

          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Playwright Nightly Regression Report</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 800px;
                margin: 60px auto;
                padding: 20px;
              }

              h1 {
                margin-bottom: 30px;
              }

              a {
                display: block;
                padding: 15px;
                margin: 10px 0;
                border: 1px solid #ddd;
                border-radius: 8px;
                text-decoration: none;
                color: #333;
              }

              a:hover {
                background: #f5f5f5;
              }
            </style>
          </head>

          <body>

            <h1>Playwright Nightly Regression Report</h1>

            <a href="./chromium/index.html">
              Chromium Regression Report
            </a>

            <a href="./firefox/index.html">
              Firefox Regression Report
            </a>

            <a href="./webkit/index.html">
              WebKit Regression Report
            </a>

          </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy Nightly Report
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}